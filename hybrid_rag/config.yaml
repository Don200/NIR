# Hybrid RAG Configuration Example

llm:
  model: "openai/gpt-4o-mini"
  # api_key: "sk-..."  # Or use OPENAI_API_KEY env var
  base_url: "https://openrouter.ai/api/v1"
  temperature: 0.0
  # max_tokens: 1024  # If not set, fetched from API (max_completion_tokens)

embedding:
  model: "baai/bge-m3"
  # api_key: "sk-..."  # Or use OPENAI_API_KEY env var
  base_url: "https://openrouter.ai/api/v1"

vector:
  chunk_size: 1024       # tokens (atom-aware splitter keeps tables/formulas whole)
  chunk_overlap: 200     # ~20% overlap
  top_k: 10              # retrieval top-k
  min_chunk_chars: 100   # drop chunks shorter than this many chars (0 = off)

graph:
  max_triplets_per_chunk: 10
  include_embeddings: true
  similarity_top_k: 10

generation:
  max_context_length: 15000  # characters, ~3 chunks

# Paths
index_dir: "./indexes"
metadata_json: "data/documents_pdf/latin_squares.json"  # display_title/authors/citation/topic per source stem

# Server
api_host: "0.0.0.0"
api_port: 8000
streamlit_port: 8501
